<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><rect x="0" y="0" width="1000" height="470" fill="#FFFFFF"/><text x="500.0" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222222">Receive side: the target writes into its own memory</text><rect x="30" y="70" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#E69F00" stroke-width="2.5"/><rect x="30" y="70" width="8" height="60" rx="3" fill="#E69F00"/><text x="164.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Peer stream (TCP)</text><text x="164.0" y="114.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">frames in release order</text><rect x="360" y="70" width="270" height="60" rx="8" fill="#FFFFFF" stroke="#E69F00" stroke-width="2.5"/><rect x="360" y="70" width="8" height="60" rx="3" fill="#E69F00"/><text x="499.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Read frame header</text><text x="499.0" y="114.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">placement, signal, get request or reply</text><rect x="700" y="70" width="270" height="60" rx="8" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2.5"/><rect x="700" y="70" width="8" height="60" rx="3" fill="#CC79A7"/><text x="839.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Window table</text><text x="839.0" y="114.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">window id to local base address</text><rect x="360" y="190" width="270" height="60" rx="8" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2.5"/><rect x="360" y="190" width="8" height="60" rx="3" fill="#CC79A7"/><text x="499.0" y="216.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Validate</text><text x="499.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">known window; offset + length within it</text><rect x="30" y="320" width="280" height="70" rx="8" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2.5"/><rect x="30" y="320" width="8" height="70" rx="3" fill="#CC79A7"/><text x="174.0" y="351.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Host window</text><text x="174.0" y="369.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">memcpy</text><rect x="360" y="320" width="280" height="70" rx="8" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2.5"/><rect x="360" y="320" width="8" height="70" rx="3" fill="#CC79A7"/><text x="504.0" y="351.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Device window</text><text x="504.0" y="369.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">CUDA copy or GDRCopy write</text><rect x="690" y="320" width="280" height="70" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.5"/><rect x="690" y="320" width="8" height="70" rx="3" fill="#D55E00"/><text x="834.0" y="351.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Signal word</text><text x="834.0" y="369.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">host: atomic add; device: NVRTC kernel</text><defs><marker id="a30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="290" y1="100" x2="358" y2="100" stroke="#222222" stroke-width="2" marker-end="url(#a30)"/><defs><marker id="a32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="630" y1="100" x2="698" y2="100" stroke="#222222" stroke-width="2" marker-end="url(#a32)"/><text x="664" y="90" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">resolve id</text><defs><marker id="a35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="835" y1="130" x2="640" y2="205" stroke="#222222" stroke-width="2" marker-end="url(#a35)"/><text x="780" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">base address</text><defs><marker id="a38" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="495" y1="130" x2="495" y2="188" stroke="#222222" stroke-width="2" marker-end="url(#a38)"/><defs><marker id="a40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="495" y1="250" x2="170" y2="318" stroke="#222222" stroke-width="2" marker-end="url(#a40)"/><text x="290" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">placement, host</text><defs><marker id="a43" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="495" y1="250" x2="495" y2="318" stroke="#222222" stroke-width="2" marker-end="url(#a43)"/><text x="560" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">placement, device</text><defs><marker id="a46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="560" y1="250" x2="830" y2="318" stroke="#222222" stroke-width="2" marker-end="url(#a46)"/><text x="720" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">signal</text><defs><marker id="a49" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs><line x1="360" y1="222" x2="300" y2="222" stroke="#D55E00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a49)"/><text x="290" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#D55E00">refused: the frame is skipped,</text><text x="290" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#D55E00">or the link is closed when</text><text x="290" y="242" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#D55E00">it cannot be skipped safely</text><text x="500" y="440" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#222222" font-style="italic">The sender never learns where the peer&#x27;s memory is: a unit names a window id, as a NIC put names a remote key.</text></svg>
