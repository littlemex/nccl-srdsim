<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect x="0" y="0" width="1000" height="600" fill="#FFFFFF"/><text x="500.0" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222222">Where the simulator sits</text><rect x="20" y="50" width="470" height="520" rx="12" fill="#F4F4F4" stroke="#0072B2" stroke-width="1.5"/><text x="34" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0072B2">Rank A (sender)</text><rect x="50" y="85" width="410" height="60" rx="8" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/><rect x="50" y="85" width="8" height="60" rx="3" fill="#0072B2"/><text x="259.0" y="111.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">GPU kernel</text><text x="259.0" y="129.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">GIN device API: put, signalled put, bare signal, get</text><rect x="50" y="190" width="410" height="60" rx="8" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/><rect x="50" y="190" width="8" height="60" rx="3" fill="#0072B2"/><text x="259.0" y="216.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">NCCL GIN proxy backend</text><text x="259.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">host thread, NCCL_GIN_TYPE=2</text><rect x="50" y="295" width="410" height="60" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="2.5"/><rect x="50" y="295" width="8" height="60" rx="3" fill="#009E73"/><text x="259.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">RMA plugin op table</text><text x="259.0" y="339.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">iput, iputSignal, iget, iflush, test, rmaProgress</text><rect x="50" y="400" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="2.5"/><rect x="50" y="400" width="8" height="60" rx="3" fill="#009E73"/><text x="144.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Scheduler</text><text x="144.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">chooses release order</text><rect x="290" y="400" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="2.5"/><rect x="290" y="400" width="8" height="60" rx="3" fill="#009E73"/><text x="379.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Send queue</text><text x="379.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">stages device sources</text><rect x="50" y="495" width="410" height="55" rx="8" fill="#FFFFFF" stroke="#E69F00" stroke-width="2.5"/><rect x="50" y="495" width="8" height="55" rx="3" fill="#E69F00"/><text x="259.0" y="527.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Transport: one TCP stream per peer</text><defs><marker id="a27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="255" y1="145" x2="255" y2="188" stroke="#222222" stroke-width="2" marker-end="url(#a27)"/><text x="265" y="160.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">descriptors</text><defs><marker id="a30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="255" y1="250" x2="255" y2="293" stroke="#222222" stroke-width="2" marker-end="url(#a30)"/><text x="265" y="265.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">op calls</text><defs><marker id="a33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="140" y1="355" x2="140" y2="398" stroke="#222222" stroke-width="2" marker-end="url(#a33)"/><text x="150" y="370.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">submit</text><defs><marker id="a36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="230" y1="430" x2="288" y2="430" stroke="#222222" stroke-width="2" marker-end="url(#a36)"/><text x="259" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">release</text><text x="140" y="478" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333333">each rmaProgress call releases</text><text x="140" y="491" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333333">up to 8 units per context</text><defs><marker id="a41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="375" y1="460" x2="375" y2="493" stroke="#222222" stroke-width="2" marker-end="url(#a41)"/><rect x="510" y="50" width="470" height="520" rx="12" fill="#F4F4F4" stroke="#CC79A7" stroke-width="1.5"/><text x="524" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#CC79A7">Rank B (target)</text><rect x="540" y="85" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2.5"/><rect x="540" y="85" width="8" height="110" rx="3" fill="#CC79A7"/><text x="644.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Data window</text><text x="644.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">payload bytes</text><rect x="760" y="85" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.5"/><rect x="760" y="85" width="8" height="110" rx="3" fill="#D55E00"/><text x="859.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Signal window</text><text x="859.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">signal words</text><rect x="540" y="300" width="410" height="70" rx="8" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2.5"/><rect x="540" y="300" width="8" height="70" rx="3" fill="#CC79A7"/><text x="749.0" y="331.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Receiving agent applies each unit</text><text x="749.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444444">into this rank&#x27;s own memory</text><rect x="540" y="495" width="410" height="55" rx="8" fill="#FFFFFF" stroke="#E69F00" stroke-width="2.5"/><rect x="540" y="495" width="8" height="55" rx="3" fill="#E69F00"/><text x="749.0" y="527.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Transport: receiving end per peer</text><defs><marker id="a60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="745" y1="495" x2="745" y2="372" stroke="#222222" stroke-width="2" marker-end="url(#a60)"/><defs><marker id="a62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="640" y1="300" x2="640" y2="197" stroke="#222222" stroke-width="2" marker-end="url(#a62)"/><text x="650" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">placement: memcpy,</text><text x="650" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">CUDA copy or GDRCopy</text><defs><marker id="a66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="855" y1="300" x2="855" y2="197" stroke="#222222" stroke-width="2" marker-end="url(#a66)"/><text x="865" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">signal: atomic add</text><text x="865" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">(host or device)</text><defs><marker id="a70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><line x1="460" y1="522" x2="538" y2="522" stroke="#222222" stroke-width="2" marker-end="url(#a70)"/><text x="500" y="584" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222222" font-style="italic">Every rank runs both halves: it sends its own operations and applies its peers&#x27; operations.</text><text x="755" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">frames arrive in release order</text></svg>
