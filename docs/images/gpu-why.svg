<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><defs><pattern id="p-sim" width="10" height="10" patternUnits="userSpaceOnUse"><g stroke="#009E73" opacity="0.35"><path d="M-2,2 l4,-4 M0,10 l10,-10 M8,12 l4,-4" stroke-width="1.2"/></g></pattern><pattern id="p-wire" width="10" height="10" patternUnits="userSpaceOnUse"><g stroke="#E69F00" opacity="0.35"><path d="M0,0.5 h10 M0.5,0 v10" stroke-width="1.0"/></g></pattern><pattern id="p-nccl" width="10" height="10" patternUnits="userSpaceOnUse"><g stroke="#0072B2" opacity="0.35"><path d="M0,5 h10 M5,0 v10" stroke-width="0.9"/></g></pattern><marker id="m33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="m39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><pattern id="p-target" width="10" height="10" patternUnits="userSpaceOnUse"><g stroke="#CC79A7" opacity="0.35"><circle cx="5" cy="5" r="1.4" stroke="none" fill="#CC79A7"/></g></pattern><marker id="m45" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="m46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect x="0" y="0" width="1100" height="470" fill="#FFFFFF"/><text x="550.0" y="30.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">What the host tests show, and what only a GPU run shows</text><rect x="30" y="60" width="470" height="380" rx="13" fill="#F5F5F5" stroke="#888888" stroke-width="1.6"/><text x="44.0" y="82.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#888888">Host tests (CI, no GPU, no NCCL)</text><rect x="60" y="110" width="410" height="60" rx="9" fill="#FFFFFF" stroke="#009E73" stroke-width="2.4"/><rect x="70" y="111.2" width="398.8" height="57.6" rx="8" fill="url(#p-sim)"/><rect x="60" y="110" width="9" height="60" rx="3" fill="#009E73"/><text x="270.0" y="137.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">Scheduler</text><text x="270.0" y="153.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">the order operations are delivered in</text><rect x="60" y="190" width="410" height="60" rx="9" fill="#FFFFFF" stroke="#E69F00" stroke-width="2.4"/><rect x="70" y="191.2" width="398.8" height="57.6" rx="8" fill="url(#p-wire)"/><rect x="60" y="190" width="9" height="60" rx="3" fill="#E69F00"/><text x="270.0" y="217.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">Transport</text><text x="270.0" y="233.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">carrying data between processes</text><rect x="60" y="270" width="410" height="60" rx="9" fill="#FFFFFF" stroke="#009E73" stroke-width="2.4"/><rect x="70" y="271.2" width="398.8" height="57.6" rx="8" fill="url(#p-sim)"/><rect x="60" y="270" width="9" height="60" rx="3" fill="#009E73"/><text x="270.0" y="297.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">Send queue</text><text x="270.0" y="313.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">data copied out of the GPU</text><text x="265.0" y="370.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#222222">Never run here: the plugin under NCCL,</text><text x="265.0" y="390.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#222222">and its writes into GPU memory</text><rect x="600" y="60" width="470" height="380" rx="13" fill="#F5F5F5" stroke="#0072B2" stroke-width="1.6"/><text x="614.0" y="82.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0072B2">GPU test (one GPU, real NCCL)</text><rect x="640" y="100" width="390" height="60" rx="9" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.4"/><rect x="650" y="101.2" width="378.8" height="57.6" rx="8" fill="url(#p-nccl)"/><rect x="640" y="100" width="9" height="60" rx="3" fill="#0072B2"/><text x="840.0" y="127.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">GPU kernel</text><text x="840.0" y="143.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">GIN puts with weak signals</text><rect x="640" y="182" width="390" height="60" rx="9" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.4"/><rect x="650" y="183.2" width="378.8" height="57.6" rx="8" fill="url(#p-nccl)"/><rect x="640" y="182" width="9" height="60" rx="3" fill="#0072B2"/><text x="840.0" y="209.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">NCCL GIN proxy backend</text><text x="840.0" y="225.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">NCCL_GIN_TYPE=2</text><line x1="835" y1="160" x2="835" y2="180" stroke="#222222" stroke-width="2.0" marker-end="url(#m33)"/><rect x="640" y="264" width="390" height="60" rx="9" fill="#FFFFFF" stroke="#009E73" stroke-width="2.4"/><rect x="650" y="265.2" width="378.8" height="57.6" rx="8" fill="url(#p-sim)"/><rect x="640" y="264" width="9" height="60" rx="3" fill="#009E73"/><text x="840.0" y="291.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">This plugin</text><text x="840.0" y="307.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">loaded through NCCL_RMA_PLUGIN</text><line x1="835" y1="242" x2="835" y2="262" stroke="#222222" stroke-width="2.0" marker-end="url(#m39)"/><rect x="640" y="346" width="390" height="60" rx="9" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2.4"/><rect x="650" y="347.2" width="378.8" height="57.6" rx="8" fill="url(#p-target)"/><rect x="640" y="346" width="9" height="60" rx="3" fill="#CC79A7"/><text x="840.0" y="373.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">Device memory</text><text x="840.0" y="389.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">data and signal counters</text><line x1="835" y1="324" x2="835" y2="344" stroke="#222222" stroke-width="2.0" marker-end="url(#m45)"/><line x1="505" y1="250" x2="595" y2="250" stroke="#222222" stroke-width="2.5" marker-end="url(#m46)"/><text x="550.0" y="243.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">adds</text></svg>
