<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><defs><pattern id="p-nccl" width="10" height="10" patternUnits="userSpaceOnUse"><g stroke="#0072B2" opacity="0.35"><path d="M0,5 h10 M5,0 v10" stroke-width="0.9"/></g></pattern><pattern id="p-wire" width="10" height="10" patternUnits="userSpaceOnUse"><g stroke="#E69F00" opacity="0.35"><path d="M0,0.5 h10 M0.5,0 v10" stroke-width="1.0"/></g></pattern><marker id="m12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><pattern id="p-sig" width="10" height="10" patternUnits="userSpaceOnUse"><g stroke="#D55E00" opacity="0.35"><path d="M-2,8 l4,4 M0,0 l10,10 M8,-2 l4,4" stroke-width="1.2"/></g></pattern><marker id="m16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><pattern id="p-target" width="10" height="10" patternUnits="userSpaceOnUse"><g stroke="#CC79A7" opacity="0.35"><circle cx="5" cy="5" r="1.4" stroke="none" fill="#CC79A7"/></g></pattern><marker id="m32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="m36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect x="0" y="0" width="1100" height="470" fill="#FFFFFF"/><text x="550.0" y="30.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">契約より強い順番に頼るコードは、順番どおりのテストを通り、SRD で壊れる</text><text x="550.0" y="58.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#555555">ランク 0 が A (シグナルなし)、次にシグナル付きの B を put する。ランク 1 はシグナルを待ち、A と B を読む。</text><rect x="40" y="85" width="480" height="340" rx="13" fill="#F5F5F5" stroke="#888888" stroke-width="1.6"/><text x="54.0" y="107.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#888888">順番どおりに届くトランスポート (テストの環境)</text><text x="280.0" y="140.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#555555">ランク 1 に届く順番</text><rect x="120" y="160" width="90" height="50" rx="5" fill="#0072B2" fill-opacity="0.16" stroke="#0072B2" stroke-width="2"/><rect x="120" y="160" width="90" height="50" rx="5" fill="url(#p-nccl)"/><text x="165.0" y="191.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">A</text><rect x="235" y="160" width="90" height="50" rx="5" fill="#E69F00" fill-opacity="0.16" stroke="#E69F00" stroke-width="2"/><rect x="235" y="160" width="90" height="50" rx="5" fill="url(#p-wire)"/><text x="280.0" y="191.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">B</text><line x1="210" y1="185" x2="233" y2="185" stroke="#222222" stroke-width="2.0" marker-end="url(#m12)"/><rect x="350" y="160" width="90" height="50" rx="5" fill="#D55E00" fill-opacity="0.16" stroke="#D55E00" stroke-width="2"/><rect x="350" y="160" width="90" height="50" rx="5" fill="url(#p-sig)"/><text x="395.0" y="191.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">S</text><line x1="325" y1="185" x2="348" y2="185" stroke="#222222" stroke-width="2.0" marker-end="url(#m16)"/><rect x="100" y="260" width="360" height="64" rx="9" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2.4"/><rect x="110" y="261.2" width="348.8" height="61.6" rx="8" fill="url(#p-target)"/><rect x="100" y="260" width="9" height="64" rx="3" fill="#CC79A7"/><text x="285.0" y="296.9" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">S を待ってから A と B を読む</text><path d="M123,375 l5,6 l10,-12" fill="none" stroke="#00802F" stroke-width="3"/><text x="152.0" y="381.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#222222">A は届いている。読む値は正しく、不具合は隠れたまま</text><rect x="580" y="85" width="480" height="340" rx="13" fill="#F5F5F5" stroke="#009E73" stroke-width="1.6"/><text x="594.0" y="107.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#009E73">SRD、またはこのシミュレータ</text><text x="820.0" y="140.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#555555">ランク 1 に届く順番</text><rect x="660" y="160" width="90" height="50" rx="5" fill="#E69F00" fill-opacity="0.16" stroke="#E69F00" stroke-width="2"/><rect x="660" y="160" width="90" height="50" rx="5" fill="url(#p-wire)"/><text x="705.0" y="191.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">B</text><rect x="775" y="160" width="90" height="50" rx="5" fill="#D55E00" fill-opacity="0.16" stroke="#D55E00" stroke-width="2"/><rect x="775" y="160" width="90" height="50" rx="5" fill="url(#p-sig)"/><text x="820.0" y="191.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">S</text><line x1="750" y1="185" x2="773" y2="185" stroke="#222222" stroke-width="2.0" marker-end="url(#m32)"/><rect x="890" y="160" width="90" height="50" rx="5" fill="#0072B2" fill-opacity="0.16" stroke="#0072B2" stroke-width="2"/><rect x="890" y="160" width="90" height="50" rx="5" fill="url(#p-nccl)"/><text x="935.0" y="191.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">A</text><line x1="865" y1="185" x2="888" y2="185" stroke="#222222" stroke-width="2.0" marker-end="url(#m36)"/><rect x="640" y="260" width="360" height="64" rx="9" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2.4"/><rect x="650" y="261.2" width="348.8" height="61.6" rx="8" fill="url(#p-target)"/><rect x="640" y="260" width="9" height="64" rx="3" fill="#CC79A7"/><text x="825.0" y="296.9" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">S を待ってから A と B を読む</text><path d="M664,369 l12,12 M676,369 l-12,12" stroke="#D55E00" stroke-width="3"/><text x="692.0" y="381.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#222222">S が A より先に届きうる。A を読むと誤った値</text><text x="550.0" y="455.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#222222" font-style="italic">契約 (I1) が S より前を保証するのは、自分の put である B だけ。A が S より前に届く保証は無い。</text></svg>
