<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><pattern id="p-nccl" width="10" height="10" patternUnits="userSpaceOnUse"><g stroke="#0072B2" opacity="0.35"><path d="M0,5 h10 M5,0 v10" stroke-width="0.9"/></g></pattern><marker id="m11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="m24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><pattern id="p-sim" width="10" height="10" patternUnits="userSpaceOnUse"><g stroke="#009E73" opacity="0.35"><path d="M-2,2 l4,-4 M0,10 l10,-10 M8,12 l4,-4" stroke-width="1.2"/></g></pattern><marker id="m32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><pattern id="p-sig" width="10" height="10" patternUnits="userSpaceOnUse"><g stroke="#D55E00" opacity="0.35"><path d="M-2,8 l4,4 M0,0 l10,10 M8,-2 l4,4" stroke-width="1.2"/></g></pattern><marker id="m38" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="m45" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="m52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="m61" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect x="0" y="0" width="1100" height="620" fill="#FFFFFF"/><text x="550.0" y="30.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">What tests/gpu/run.sh does for each mode and seed</text><rect x="40" y="60" width="300" height="70" rx="9" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.4"/><rect x="50" y="61.2" width="288.8" height="67.6" rx="8" fill="url(#p-nccl)"/><rect x="40" y="60" width="9" height="70" rx="3" fill="#0072B2"/><text x="195.0" y="92.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">start its own MPS server</text><text x="195.0" y="108.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">refuses to start next to another</text><circle cx="30" cy="95" r="13" fill="#222222"/><text x="30" y="100" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><rect x="380" y="55" width="690" height="395" rx="13" fill="#F5F5F5" stroke="#888888" stroke-width="1.6"/><text x="394.0" y="77.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#888888">for each mode, for each seed 1..SEEDS</text><line x1="342" y1="95" x2="408" y2="120" stroke="#222222" stroke-width="2.0" marker-end="url(#m11)"/><rect x="410" y="95" width="300" height="70" rx="9" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.4"/><rect x="420" y="96.2" width="288.8" height="67.6" rx="8" fill="url(#p-nccl)"/><rect x="410" y="95" width="9" height="70" rx="3" fill="#0072B2"/><text x="565.0" y="120.6" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">launch every rank</text><text x="565.0" y="137.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">its own NCCL_HOSTID, same mode and seed</text><text x="565.0" y="151.6" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">each under timeout RUN_TIMEOUT</text><circle cx="400" cy="130" r="13" fill="#222222"/><text x="400" y="135" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><rect x="410" y="205" width="300" height="60" rx="9" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.4"/><rect x="420" y="206.2" width="288.8" height="57.6" rx="8" fill="url(#p-nccl)"/><rect x="410" y="205" width="9" height="60" rx="3" fill="#0072B2"/><text x="565.0" y="239.9" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">wait for each rank to exit</text><line x1="560" y1="167" x2="560" y2="203" stroke="#222222" stroke-width="2.0" marker-end="url(#m24)"/><circle cx="400" cy="235" r="13" fill="#222222"/><text x="400" y="240" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><rect x="760" y="95" width="290" height="66" rx="9" fill="#FFFFFF" stroke="#009E73" stroke-width="2.4"/><rect x="770" y="96.2" width="278.8" height="63.6" rx="8" fill="url(#p-sim)"/><rect x="760" y="95" width="9" height="66" rx="3" fill="#009E73"/><text x="910.0" y="125.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">exit 0 or 1</text><text x="910.0" y="141.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">keep waiting</text><line x1="712" y1="235" x2="758" y2="128" stroke="#222222" stroke-width="2.0" marker-end="url(#m32)"/><rect x="760" y="180" width="290" height="66" rx="9" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.4"/><rect x="770" y="181.2" width="278.8" height="63.6" rx="8" fill="url(#p-sig)"/><rect x="760" y="180" width="9" height="66" rx="3" fill="#D55E00"/><text x="910.0" y="210.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">exit 3: a wait timed out</text><text x="910.0" y="226.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">others get 10 s, then stopped</text><line x1="712" y1="235" x2="758" y2="213" stroke="#222222" stroke-width="2.0" marker-end="url(#m38)"/><rect x="760" y="265" width="290" height="66" rx="9" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.4"/><rect x="770" y="266.2" width="278.8" height="63.6" rx="8" fill="url(#p-sig)"/><rect x="760" y="265" width="9" height="66" rx="3" fill="#D55E00"/><text x="910.0" y="287.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">any other exit</text><text x="910.0" y="304.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">setup error, crash, time limit:</text><text x="910.0" y="319.6" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">others stopped at once</text><line x1="712" y1="235" x2="758" y2="298" stroke="#222222" stroke-width="2.0" marker-end="url(#m45)"/><rect x="410" y="330" width="300" height="90" rx="9" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.4"/><rect x="420" y="331.2" width="288.8" height="87.6" rx="8" fill="url(#p-nccl)"/><rect x="410" y="330" width="9" height="90" rx="3" fill="#0072B2"/><text x="565.0" y="365.6" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">status of the seed</text><text x="565.0" y="382.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">the first exit other than 0 or 1;</text><text x="565.0" y="396.6" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">else 1 if any rank exited 1, else 0</text><line x1="560" y1="267" x2="560" y2="328" stroke="#222222" stroke-width="2.0" marker-end="url(#m52)"/><circle cx="400" cy="375" r="13" fill="#222222"/><text x="400" y="380" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text><rect x="760" y="350" width="290" height="70" rx="9" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.4"/><rect x="770" y="351.2" width="278.8" height="67.6" rx="8" fill="url(#p-nccl)"/><rect x="760" y="350" width="9" height="70" rx="3" fill="#0072B2"/><text x="910.0" y="375.6" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">restart MPS</text><text x="910.0" y="392.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">seed status 3 or more, or a rank</text><text x="910.0" y="406.6" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">stopped by timeout or a signal (124+)</text><line x1="712" y1="375" x2="758" y2="385" stroke="#222222" stroke-width="2.0" marker-end="url(#m61)"/><text x="550.0" y="485.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Verdict per mode</text><circle cx="440" cy="480" r="13" fill="#222222"/><text x="440" y="485" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5</text><rect x="60" y="510" width="470" height="80" rx="9" fill="#FFFFFF" stroke="#009E73" stroke-width="2.4"/><rect x="70" y="511.2" width="458.8" height="77.6" rx="8" fill="url(#p-sim)"/><rect x="60" y="510" width="9" height="80" rx="3" fill="#009E73"/><text x="300.0" y="546.4" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">modes that keep I1</text><text x="300.0" y="563.2" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">PASS when every seed is 0</text><rect x="570" y="510" width="470" height="80" rx="9" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.4"/><rect x="580" y="511.2" width="458.8" height="77.6" rx="8" fill="url(#p-sig)"/><rect x="570" y="510" width="9" height="80" rx="3" fill="#D55E00"/><text x="810.0" y="538.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">violate-i1</text><text x="810.0" y="554.7" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">PASS when every seed is 0 or 1</text><text x="810.0" y="571.6" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">and at least one is 1</text></svg>
