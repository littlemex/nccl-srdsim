rect x="0" y="0" width="1100" height="560" fill="#FFFFFF"/><text x="550.0" y="30.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">Threads, contexts and connections of one rank</text><rect x="190" y="55" width="600" height="480" rx="13" fill="#F5F5F5" stroke="#009E73" stroke-width="1.6"/><text x="204.0" y="77.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#009E73">Rank 0</text><rect x="215" y="90" width="550" height="60" rx="9" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.4"/><rect x="225" y="91.2" width="538.8" height="57.6" rx="8" fill="url(#p-nccl)"/><rect x="215" y="90" width="9" height="60" rx="3" fill="#0072B2"/><text x="495.0" y="117.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">NCCL&#x27;s GIN proxy thread</text><text x="495.0" y="133.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">calls submit, rmaProgress and test</text><rect x="215" y="200" width="265" height="80" rx="9" fill="#FFFFFF" stroke="#009E73" stroke-width="2.4"/><rect x="225" y="201.2" width="253.8" height="77.6" rx="8" fill="url(#p-sim)"/><rect x="215" y="200" width="9" height="80" rx="3" fill="#009E73"/><text x="352.5" y="229.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">RMA context 0</text><text x="352.5" y="246.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">its own scheduler</text><text x="352.5" y="261.6" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">and mutex</text><line x1="347" y1="150" x2="347" y2="198" stroke="#222222" stroke-width="2.0" marker-end="url(#m15)"/><line x1="347" y1="280" x2="347" y2="333" stroke="#222222" stroke-width="2.0" marker-end="url(#m16)"/><rect x="500" y="200" width="265" height="80" rx="9" fill="#FFFFFF" stroke="#009E73" stroke-width="2.4"/><rect x="510" y="201.2" width="253.8" height="77.6" rx="8" fill="url(#p-sim)"/><rect x="500" y="200" width="9" height="80" rx="3" fill="#009E73"/><text x="637.5" y="229.3" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">RMA context 1</text><text x="637.5" y="246.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">its own scheduler</text><text x="637.5" y="261.6" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">and mutex</text><line x1="632" y1="150" x2="632" y2="198" stroke="#222222" stroke-width="2.0" marker-end="url(#m23)"/><line x1="632" y1="280" x2="632" y2="333" stroke="#222222" stroke-width="2.0" marker-end="url(#m24)"/><text x="490.0" y="305.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#222222" font-style="italic">nothing is ordered across contexts</text><rect x="215" y="335" width="550" height="56" rx="9" fill="#FFFFFF" stroke="#E69F00" stroke-width="2.4"/><rect x="225" y="336.2" width="538.8" height="53.6" rx="8" fill="url(#p-wire)"/><rect x="215" y="335" width="9" height="56" rx="3" fill="#E69F00"/><text x="495.0" y="367.9" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">Send streams: one per peer</text><rect x="215" y="445" width="550" height="64" rx="9" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2.4"/><rect x="225" y="446.2" width="538.8" height="61.6" rx="8" fill="url(#p-target)"/><rect x="215" y="445" width="9" height="64" rx="3" fill="#CC79A7"/><text x="495.0" y="481.9" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">Receiving agents: one thread per inbound stream</text><rect x="870" y="335" width="210" height="174" rx="9" fill="#FFFFFF" stroke="#888888" stroke-width="2.4"/><rect x="870" y="335" width="9" height="174" rx="3" fill="#888888"/><text x="980.0" y="419.1" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">Ranks 1, 2</text><text x="980.0" y="435.8" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">same structure</text><line x1="767" y1="363" x2="868" y2="363" stroke="#222222" stroke-width="2.0" marker-end="url(#m38)"/><text x="817.5" y="356.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">to each peer</text><line x1="868" y1="477" x2="767" y2="477" stroke="#222222" stroke-width="2.0" marker-end="url(#m40)"/><text x="817.5" y="470.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">from each peer</text><path d="M 213,363 C 95,363 95,477 213,477" fill="none" stroke="#555555" stroke-width="2.0" stroke-dasharray="7 4" marker-end="url(#m42)"/><text x="120.0" y="410.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#555555">to itself:</text><text x="120.0" y="426.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#555555">a socket pair</text><text x="935.0" y="540.0" font-family="Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555">every pair