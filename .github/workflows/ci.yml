name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # versions.env is the one place that names an upstream version; the matrices below are built from it.
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      nccl: ${{ steps.read.outputs.nccl }}
      cuda: ${{ steps.read.outputs.cuda }}
      nccl_default_tag: ${{ steps.read.outputs.nccl_default_tag }}
      nccl_default_commit: ${{ steps.read.outputs.nccl_default_commit }}
      cuda_default: ${{ steps.read.outputs.cuda_default }}
      cuda_keyring_deb: ${{ steps.read.outputs.cuda_keyring_deb }}
      cuda_keyring_sha256: ${{ steps.read.outputs.cuda_keyring_sha256 }}
      gdrcopy_tag: ${{ steps.read.outputs.gdrcopy_tag }}
      gdrcopy_commit: ${{ steps.read.outputs.gdrcopy_commit }}
      libfabric_tag: ${{ steps.read.outputs.libfabric_tag }}
      libfabric_commit: ${{ steps.read.outputs.libfabric_commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: read
        run: |
          ./ci/versions_matrix.sh > "$RUNNER_TEMP/versions"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/versions"

  # Its own job, so that a stray version in a document does not stop the builds from reporting.
  pinned-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Documents, workflows and scripts name only pinned versions
        run: ./ci/check_versions.sh

  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # docs/configuration.md has a row for every SRDSIM_* variable the source reads, and no other.
  configuration-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./scripts/check_configuration_reference.sh

  # The host tests under each sanitizer. ThreadSanitizer checks the threads of every test process,
  # including a process a test forks; it cannot see a race between two processes, and a finding in a
  # forked child fails the test only through the child's exit status. The plugin is not built here.
  host-tests-sanitized:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The sanitizers of this toolchain cannot map their shadow memory with more ASLR entropy than 28
      # bits. The runner image used 28 when this was written; setting it keeps the jobs working on an
      # image that does not, and the value before the change is logged.
      - name: Lower ASLR entropy for the sanitizers
        run: |
          sudo sysctl vm.mmap_rnd_bits
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSRDSIM_SANITIZER=${{ matrix.sanitizer }}
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  # The plugin against NCCL's plugin ABI for each supported NCCL release, in each delivery
  # configuration, with declaration-only CUDA stand-ins. Checks the generated NCCL version, the op
  # tables exported, and that each configuration really compiled its delivery path in.
  plugin-abi:
    name: plugin-abi (${{ matrix.delivery }}, ${{ matrix.nccl.tag }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        delivery: [host-only, cuda, cuda-gdrcopy]
        nccl: ${{ fromJSON(needs.versions.outputs.nccl) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch NCCL
        env:
          NCCL_TAG: ${{ matrix.nccl.tag }}
          NCCL_COMMIT: ${{ matrix.nccl.commit }}
        run: |
          git clone --quiet --depth 1 --branch "$NCCL_TAG" https://github.com/NVIDIA/nccl.git "$RUNNER_TEMP/nccl-src"
          test "$(git -C "$RUNNER_TEMP/nccl-src" rev-parse HEAD)" = "$NCCL_COMMIT"
      - name: Generate the headers and check the version
        env:
          VERSION_CODE: ${{ matrix.nccl.version_code }}
        run: |
          NCCL_SRC="$RUNNER_TEMP/nccl-src" ./scripts/prepare_nccl_headers.sh "$RUNNER_TEMP/inc"
          grep -Eq "^#define NCCL_VERSION_CODE $VERSION_CODE\$" "$RUNNER_TEMP/inc/nccl/nccl.h"
      - name: Build, check the exports and the delivery path
        env:
          DELIVERY: ${{ matrix.delivery }}
        run: |
          case "$DELIVERY" in
            host-only) DEFS=""; LINK="-Wl,-z,defs" ;;
            cuda) DEFS="-DSRDSIM_WITH_CUDA"; LINK="" ;;
            cuda-gdrcopy) DEFS="-DSRDSIM_WITH_CUDA -DSRDSIM_WITH_GDRCOPY"; LINK="" ;;
          esac
          SO="$RUNNER_TEMP/libnccl-rma-srdsim.so"
          c++ -std=c++17 -O2 -fPIC -shared -Wall -Wextra -Werror $DEFS \
            -isystem "$RUNNER_TEMP/inc/nccl" -isystem "$RUNNER_TEMP/inc/cuda-stub" -I src \
            src/nccl_rma_srdsim.cc -o "$SO" $LINK -pthread
          ./ci/check_exports.sh "$SO" "$RUNNER_TEMP/nccl-src"
          EXPORTS=$(./ci/expected_exports.sh "$RUNNER_TEMP/nccl-src")
          EXPORTS=$(grep -v '^!' <<<"$EXPORTS")
          nm -D --undefined-only "$SO" > "$RUNNER_TEMP/undefined"
          has() { grep -Eq " U $1" "$RUNNER_TEMP/undefined"; }
          case "$DELIVERY" in
            host-only)
              ! has 'cu[A-Z]' && ! has nvrtc && ! has gdr_ || { echo "host-only build references CUDA or GDRCopy"; exit 1; }
              cc ci/dlopen_check.c -o "$RUNNER_TEMP/dlopen_check" -ldl
              "$RUNNER_TEMP/dlopen_check" "$SO" $EXPORTS ;;
            cuda)
              has 'cu[A-Z]' && has nvrtc && ! has gdr_ || { echo "cuda build lacks the CUDA path or references GDRCopy"; exit 1; } ;;
            cuda-gdrcopy)
              has 'cu[A-Z]' && has nvrtc && has gdr_ || { echo "cuda-gdrcopy build lacks a delivery path"; exit 1; } ;;
          esac

  # The documented CMake path, against the real CUDA headers and libraries of two major versions
  # (the code branches on CUDA_VERSION), with and without a real GDRCopy.
  plugin-cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        cuda: ${{ fromJSON(needs.versions.outputs.cuda) }}
        gdrcopy: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install CUDA development packages
        env:
          CUDA_PKG: ${{ matrix.cuda }}
          KEYRING_DEB: ${{ needs.versions.outputs.cuda_keyring_deb }}
          KEYRING_SHA256: ${{ needs.versions.outputs.cuda_keyring_sha256 }}
        run: |
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/$KEYRING_DEB"
          echo "$KEYRING_SHA256  $KEYRING_DEB" | sha256sum -c
          sudo dpkg -i "$KEYRING_DEB"
          sudo apt-get update -q
          sudo apt-get install -y -q "cuda-nvcc-$CUDA_PKG" "cuda-cudart-dev-$CUDA_PKG" "cuda-driver-dev-$CUDA_PKG" "cuda-nvrtc-dev-$CUDA_PKG"
      - name: Build GDRCopy's user library
        if: matrix.gdrcopy == 'ON'
        env:
          GDRCOPY_TAG: ${{ needs.versions.outputs.gdrcopy_tag }}
          GDRCOPY_COMMIT: ${{ needs.versions.outputs.gdrcopy_commit }}
        run: |
          git clone --quiet --depth 1 --branch "$GDRCOPY_TAG" https://github.com/NVIDIA/gdrcopy.git "$RUNNER_TEMP/gdrcopy"
          test "$(git -C "$RUNNER_TEMP/gdrcopy" rev-parse HEAD)" = "$GDRCOPY_COMMIT"
          make -C "$RUNNER_TEMP/gdrcopy" prefix="$RUNNER_TEMP/gdr" lib_install
      - name: Fetch NCCL
        env:
          NCCL_TAG: ${{ needs.versions.outputs.nccl_default_tag }}
          NCCL_COMMIT: ${{ needs.versions.outputs.nccl_default_commit }}
        run: |
          git clone --quiet --depth 1 --branch "$NCCL_TAG" https://github.com/NVIDIA/nccl.git "$RUNNER_TEMP/nccl-src"
          test "$(git -C "$RUNNER_TEMP/nccl-src" rev-parse HEAD)" = "$NCCL_COMMIT"
      - name: Build the plugin with CMake
        env:
          CUDA_PKG: ${{ matrix.cuda }}
          GDRCOPY: ${{ matrix.gdrcopy }}
        run: |
          NCCL_SRC="$RUNNER_TEMP/nccl-src" ./scripts/prepare_nccl_headers.sh "$RUNNER_TEMP/inc"
          cmake -S . -B build -DSRDSIM_BUILD_TESTS=OFF -DSRDSIM_BUILD_PLUGIN=ON \
            -DCUDAToolkit_ROOT="/usr/local/cuda-${CUDA_PKG/-/.}" \
            -DSRDSIM_WITH_GDRCOPY="$GDRCOPY" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/gdr" \
            -DCMAKE_CXX_FLAGS=-Werror \
            -DNCCL_PLUGIN_INCLUDE_DIRS="$RUNNER_TEMP/inc/nccl"
          cmake --build build -j
          nm -D --undefined-only build/libnccl-rma-srdsim.so > undefined
          ./ci/check_exports.sh build/libnccl-rma-srdsim.so "$RUNNER_TEMP/nccl-src"
          grep -Eq ' U cu[A-Z]' undefined && grep -q ' U nvrtc' undefined || { echo "the CUDA delivery path is not compiled in"; exit 1; }
          if [ "$GDRCOPY" = ON ]; then
            grep -q ' U gdr_' undefined || { echo "SRDSIM_WITH_GDRCOPY=ON but GDRCopy is not compiled in"; exit 1; }
          else
            ! grep -q ' U gdr_' undefined || { echo "SRDSIM_WITH_GDRCOPY=OFF but GDRCopy is referenced"; exit 1; }
          fi

  # The CMake path without the CUDA delivery path: CUDA headers only (nccl.h needs them), no driver
  # API or NVRTC linked.
  plugin-host-only-cmake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: versions
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the CUDA runtime headers
        env:
          KEYRING_DEB: ${{ needs.versions.outputs.cuda_keyring_deb }}
          KEYRING_SHA256: ${{ needs.versions.outputs.cuda_keyring_sha256 }}
          CUDA_PKG: ${{ needs.versions.outputs.cuda_default }}
        run: |
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/$KEYRING_DEB"
          echo "$KEYRING_SHA256  $KEYRING_DEB" | sha256sum -c
          sudo dpkg -i "$KEYRING_DEB"
          sudo apt-get update -q
          sudo apt-get install -y -q "cuda-nvcc-$CUDA_PKG" "cuda-cudart-dev-$CUDA_PKG"
      - name: Build
        env:
          NCCL_TAG: ${{ needs.versions.outputs.nccl_default_tag }}
          NCCL_COMMIT: ${{ needs.versions.outputs.nccl_default_commit }}
          CUDA_PKG: ${{ needs.versions.outputs.cuda_default }}
        run: |
          git clone --quiet --depth 1 --branch "$NCCL_TAG" https://github.com/NVIDIA/nccl.git "$RUNNER_TEMP/nccl-src"
          test "$(git -C "$RUNNER_TEMP/nccl-src" rev-parse HEAD)" = "$NCCL_COMMIT"
          NCCL_SRC="$RUNNER_TEMP/nccl-src" ./scripts/prepare_nccl_headers.sh "$RUNNER_TEMP/inc"
          cmake -S . -B build -DSRDSIM_BUILD_TESTS=ON -DSRDSIM_BUILD_PLUGIN=ON -DSRDSIM_WITH_CUDA=OFF \
            -DCUDAToolkit_ROOT="/usr/local/cuda-${CUDA_PKG/-/.}" \
            -DCMAKE_CXX_FLAGS=-Werror -DNCCL_PLUGIN_INCLUDE_DIRS="$RUNNER_TEMP/inc/nccl"
          cmake --build build -j
          if nm -D --undefined-only build/libnccl-rma-srdsim.so | grep -Eq ' U (cu[A-Z]|nvrtc|gdr_)'; then
            echo "built without the CUDA delivery path but references CUDA or GDRCopy"; exit 1
          fi
          cc ci/dlopen_check.c -o dlopen_check -ldl
          ./ci/check_exports.sh build/libnccl-rma-srdsim.so "$RUNNER_TEMP/nccl-src"
          EXPORTS=$(./ci/expected_exports.sh "$RUNNER_TEMP/nccl-src")
          ./dlopen_check "$PWD/build/libnccl-rma-srdsim.so" $(grep -v '^!' <<<"$EXPORTS")
          want=$(grep -v '^!' <<<"$EXPORTS" | sed 's/^ncclRmaPlugin_v//' | sort -n | tr '\n' ' ')
          have=$(ctest --test-dir build -N -R plugin_harness | sed -n 's/.*plugin_harness_v\([0-9]*\)$/\1/p' | sort -n | tr '\n' ' ')
          test "$want" = "$have" || { echo "the harness runs tables '$have' but the plugin exports '$want'"; exit 1; }
      - name: The plugin harness, once per op-table version
        run: ctest --test-dir build -R plugin_harness --output-on-failure --verbose
      - name: The same build serves every pinned release
        run: ./ci/check_serves_all.sh build/libnccl-rma-srdsim.so
      - name: The export check fails without a release to check against
        run: |
          mkdir -p "$RUNNER_TEMP/empty"
          if ./ci/check_exports.sh build/libnccl-rma-srdsim.so "$RUNNER_TEMP/empty" 2> "$RUNNER_TEMP/err"; then
            echo "check_exports.sh passed with no NCCL source"; exit 1
          fi
          grep -q 'no rma_vN.h' "$RUNNER_TEMP/err" || { echo "check_exports.sh failed for another reason:"; cat "$RUNNER_TEMP/err"; exit 1; }

  # The plugin harness under each sanitizer: the plugin and the harness are both instrumented.
  plugin-harness-sanitized:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the CUDA runtime headers
        env:
          KEYRING_DEB: ${{ needs.versions.outputs.cuda_keyring_deb }}
          KEYRING_SHA256: ${{ needs.versions.outputs.cuda_keyring_sha256 }}
          CUDA_PKG: ${{ needs.versions.outputs.cuda_default }}
        run: |
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/$KEYRING_DEB"
          echo "$KEYRING_SHA256  $KEYRING_DEB" | sha256sum -c
          sudo dpkg -i "$KEYRING_DEB"
          sudo apt-get update -q
          sudo apt-get install -y -q "cuda-nvcc-$CUDA_PKG" "cuda-cudart-dev-$CUDA_PKG"
      - name: Lower ASLR entropy for the sanitizers
        run: |
          sudo sysctl vm.mmap_rnd_bits
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build and run
        env:
          NCCL_TAG: ${{ needs.versions.outputs.nccl_default_tag }}
          NCCL_COMMIT: ${{ needs.versions.outputs.nccl_default_commit }}
          CUDA_PKG: ${{ needs.versions.outputs.cuda_default }}
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          git clone --quiet --depth 1 --branch "$NCCL_TAG" https://github.com/NVIDIA/nccl.git "$RUNNER_TEMP/nccl-src"
          test "$(git -C "$RUNNER_TEMP/nccl-src" rev-parse HEAD)" = "$NCCL_COMMIT"
          NCCL_SRC="$RUNNER_TEMP/nccl-src" ./scripts/prepare_nccl_headers.sh "$RUNNER_TEMP/inc"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSRDSIM_SANITIZER="$SANITIZER" \
            -DSRDSIM_BUILD_TESTS=ON -DSRDSIM_BUILD_PLUGIN=ON -DSRDSIM_WITH_CUDA=OFF \
            -DCUDAToolkit_ROOT="/usr/local/cuda-${CUDA_PKG/-/.}" -DNCCL_PLUGIN_INCLUDE_DIRS="$RUNNER_TEMP/inc/nccl"
          cmake --build build -j
          ctest --test-dir build -R plugin_harness --output-on-failure --verbose

  # The plugin harness against the CUDA build, with no GPU: the driver library is installed so the plugin
  # loads, and every window is a host window, so no device is opened. It covers the CUDA build's handling of
  # host windows, which the host-only build does not compile.
  plugin-harness-cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: versions
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the CUDA toolkit and the driver library
        env:
          KEYRING_DEB: ${{ needs.versions.outputs.cuda_keyring_deb }}
          KEYRING_SHA256: ${{ needs.versions.outputs.cuda_keyring_sha256 }}
          CUDA_PKG: ${{ needs.versions.outputs.cuda_default }}
        run: |
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/$KEYRING_DEB"
          echo "$KEYRING_SHA256  $KEYRING_DEB" | sha256sum -c
          sudo dpkg -i "$KEYRING_DEB"
          sudo apt-get update -q
          . ./versions.env
          sudo apt-get install -y -q "cuda-nvcc-$CUDA_PKG" "cuda-cudart-dev-$CUDA_PKG" "cuda-driver-dev-$CUDA_PKG" \
            "cuda-nvrtc-dev-$CUDA_PKG" "$CI_DRIVER_LIB_PKG"
          ls -l /usr/lib/x86_64-linux-gnu/libcuda.so.1
          dpkg-query -W "$CI_DRIVER_LIB_PKG"
      - name: Build and run
        env:
          NCCL_TAG: ${{ needs.versions.outputs.nccl_default_tag }}
          NCCL_COMMIT: ${{ needs.versions.outputs.nccl_default_commit }}
          CUDA_PKG: ${{ needs.versions.outputs.cuda_default }}
        run: |
          git clone --quiet --depth 1 --branch "$NCCL_TAG" https://github.com/NVIDIA/nccl.git "$RUNNER_TEMP/nccl-src"
          test "$(git -C "$RUNNER_TEMP/nccl-src" rev-parse HEAD)" = "$NCCL_COMMIT"
          NCCL_SRC="$RUNNER_TEMP/nccl-src" ./scripts/prepare_nccl_headers.sh "$RUNNER_TEMP/inc"
          cmake -S . -B build -DSRDSIM_BUILD_TESTS=ON -DSRDSIM_BUILD_PLUGIN=ON -DSRDSIM_WITH_CUDA=ON \
            -DCUDAToolkit_ROOT="/usr/local/cuda-${CUDA_PKG/-/.}" -DNCCL_PLUGIN_INCLUDE_DIRS="$RUNNER_TEMP/inc/nccl"
          cmake --build build -j
          ctest --test-dir build -R plugin_harness --output-on-failure --verbose

  # The GPU test compiles against NCCL's device API headers. It runs on a GPU host (tests/gpu/run.sh).
  gpu-test-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: versions
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the CUDA compiler and runtime headers
        env:
          KEYRING_DEB: ${{ needs.versions.outputs.cuda_keyring_deb }}
          KEYRING_SHA256: ${{ needs.versions.outputs.cuda_keyring_sha256 }}
          CUDA_PKG: ${{ needs.versions.outputs.cuda_default }}
        run: |
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/$KEYRING_DEB"
          echo "$KEYRING_SHA256  $KEYRING_DEB" | sha256sum -c
          sudo dpkg -i "$KEYRING_DEB"
          sudo apt-get update -q
          sudo apt-get install -y -q "cuda-nvcc-$CUDA_PKG" "cuda-cudart-dev-$CUDA_PKG" "cuda-cccl-$CUDA_PKG"
      - name: Compile
        env:
          NCCL_TAG: ${{ needs.versions.outputs.nccl_default_tag }}
          NCCL_COMMIT: ${{ needs.versions.outputs.nccl_default_commit }}
          CUDA_PKG: ${{ needs.versions.outputs.cuda_default }}
        run: |
          git clone --quiet --depth 1 --branch "$NCCL_TAG" https://github.com/NVIDIA/nccl.git "$RUNNER_TEMP/nccl-src"
          test "$(git -C "$RUNNER_TEMP/nccl-src" rev-parse HEAD)" = "$NCCL_COMMIT"
          NCCL_SRC="$RUNNER_TEMP/nccl-src" ./scripts/prepare_nccl_headers.sh "$RUNNER_TEMP/inc"
          mkdir -p "$RUNNER_TEMP/devinc"
          cp "$RUNNER_TEMP/nccl-src/src/include/nccl_device.h" "$RUNNER_TEMP/devinc/"
          cp -R "$RUNNER_TEMP/nccl-src/src/include/nccl_device" "$RUNNER_TEMP/devinc/"
          # NCCL's source headers include every GIN backend's device code unless told otherwise; this test
          # uses only the proxy backend, and the GDAKI and EFA-GDA backends need vendor headers CI lacks.
          for t in gin_signal_order gin_get; do
            "/usr/local/cuda-${CUDA_PKG/-/.}/bin/nvcc" -std=c++17 -arch=sm_90 -Werror all-warnings \
              -DNCCL_GIN_GDAKI_ENABLE=0 -DNCCL_GIN_EFA_GDA_ENABLE=0 \
              -I "$RUNNER_TEMP/inc/nccl" -I "$RUNNER_TEMP/devinc" \
              -c "tests/gpu/$t.cu" -o "$RUNNER_TEMP/$t.o"
          done

  # The libfabric provider, built inside a pinned libfabric that also builds its own efa provider, so the
  # preferred form of FI_PROVIDER_PATH is shown to win over the built-in provider of the same name.
  fi-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: versions
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build libfabric with the provider
        env:
          LIBFABRIC_TAG: ${{ needs.versions.outputs.libfabric_tag }}
          LIBFABRIC_COMMIT: ${{ needs.versions.outputs.libfabric_commit }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libibverbs-dev librdmacm-dev libnuma-dev
          git clone --quiet --depth 1 --branch "$LIBFABRIC_TAG" https://github.com/ofiwg/libfabric.git "$RUNNER_TEMP/libfabric-src"
          test "$(git -C "$RUNNER_TEMP/libfabric-src" rev-parse HEAD)" = "$LIBFABRIC_COMMIT"
          ./scripts/build_fi_provider.sh "$RUNNER_TEMP/libfabric-src" "$RUNNER_TEMP/libfabric" \
            --enable-efa=yes --enable-tcp=yes --disable-psm3 --disable-opx --disable-usnic --disable-verbs --disable-lpp
          "$RUNNER_TEMP/libfabric/bin/fi_info" -l | grep -q '^efa:' || { echo "libfabric was built without its efa provider"; exit 1; }
      - name: Test the provider
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/libfabric/lib/pkgconfig" LD_LIBRARY_PATH="$RUNNER_TEMP/libfabric/lib"
          cmake -S . -B build -DSRDSIM_BUILD_TESTS=OFF -DSRDSIM_BUILD_FI_TEST=ON -DCMAKE_CXX_FLAGS=-Werror \
            -DSRDSIM_FI_PROVIDER="$RUNNER_TEMP/libfabric/lib/srdsim/libsrdsim-fi.so"
          cmake --build build -j --target test_fi_provider test_fi_transfer test_fi_wire test_fi_multipeer test_fi_cq_threads
          ctest --test-dir build -R '^fi_' --output-on-failure --verbose
          # The negative control fails for the reason it exists: a remote completion found its write incomplete.
          SRDSIM_FI_CQ_DATA_EARLY=1 ./build/test_fi_transfer "$RUNNER_TEMP/libfabric/lib/srdsim/libsrdsim-fi.so" writedata \
            > early.log 2>&1 && { echo "the negative control passed"; exit 1; }
          grep -q 'FAIL every remote completion with CQ data found its whole 1 MiB write landed' early.log \
            || { echo "the negative control failed for another reason:"; cat early.log; exit 1; }
      - name: The provider is loaded only when it is named
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/libfabric/lib"
          FI=$RUNNER_TEMP/libfabric/bin/fi_info
          if ls "$RUNNER_TEMP/libfabric/lib/libfabric/" | grep -q srdsim; then
            echo "the provider is in libfabric's default provider directory"; exit 1
          fi
          FI_LOG_LEVEL=info "$FI" -p efa > unnamed.out 2> unnamed.log || true
          if grep -q 'srdsim' unnamed.out unnamed.log; then echo "the provider was loaded without being named"; exit 1; fi
          FI_LOG_LEVEL=info FI_PROVIDER_PATH="+$RUNNER_TEMP/libfabric/lib/srdsim/libsrdsim-fi.so" "$FI" -p efa > named.out 2> named.log
          grep -q 'loading preferred provider' named.log || { echo "the named provider was not loaded as preferred"; exit 1; }
          grep -q 'domain: srdsim0-rdm' named.out || { echo "fi_info does not list the provider when it is named"; cat named.out; exit 1; }
      - name: The test fails when the provider claims an ordering SRD does not give
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/libfabric/lib/pkgconfig" LD_LIBRARY_PATH="$RUNNER_TEMP/libfabric/lib"
          sed -i 's/^#define SRDSIM_MSG_ORDER FI_ORDER_SAS$/#define SRDSIM_MSG_ORDER (FI_ORDER_SAS | FI_ORDER_RMA_WAW)/' src/fi/srdsim_attr.c
          git diff --quiet -- src/fi/srdsim_attr.c && { echo "the mutation did not apply"; exit 1; }
          ./scripts/build_fi_provider.sh "$RUNNER_TEMP/libfabric-src" "$RUNNER_TEMP/libfabric-mutated" \
            --enable-efa=no --enable-tcp=yes --disable-psm3 --disable-opx --disable-usnic --disable-verbs --disable-lpp
          if "$PWD/build/test_fi_provider" "$RUNNER_TEMP/libfabric-mutated/lib/srdsim/libsrdsim-fi.so" > mutated.log 2>&1; then
            echo "the test passed against a provider that claims write-after-write ordering"; exit 1
          fi
          grep -q '^FAIL write-after-write ordering is refused$' mutated.log \
            || { echo "the test failed for another reason:"; cat mutated.log; exit 1; }

  # The provider and its tests under a sanitizer, which is where the provider's own agent thread is
  # checked against the consumer's: a delivery landing while the test reads the target region, and
  # the completion writes. The plain fi-provider job above cannot see any of that.
  #
  # --disable-opx is load-bearing for `thread`, not a preference. opx's target_clones atomics are the
  # only ifuncs in libfabric.so; the loader resolves them during startup relocation, before the
  # executable's ThreadSanitizer runtime is initialised, and an instrumented resolver then calls
  # __tsan_func_entry with a null thread state and faults inside ld.so. Every ThreadSanitizer binary
  # that has libfabric as a link-time dependency dies before main without it. A dlopened instrumented
  # libfabric is unaffected, which is why nothing else here noticed.
  #
  # What this pass actually watches: the handover of completions from the provider's agent thread to
  # the consumer's (`x->events`), the delivery landing in a region a test is reading, and -- in
  # fi_cq_threads -- two consumer threads inside one completion queue whose lock libfabric's utility
  # layer disarms for the threading model NIXL asks for.
  fi-provider-sanitized:
    name: fi-provider-sanitized (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            cc: gcc
            cxx: g++
          # ThreadSanitizer is built with clang because gcc's emits -Wtsan ("atomic_thread_fence is
          # not supported with -fsanitize=thread") on the fences this provider uses to publish a
          # payload, and build_fi_provider.sh treats any warning as a failure. Neither compiler's
          # runtime models a fence; only gcc says so, so this is a build-time reason and not a claim
          # that clang sees more.
          - sanitizer: thread
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Same reason as host-tests-sanitized: this toolchain's sanitizers cannot map their shadow
      # memory with more than 28 bits of ASLR entropy.
      - name: Lower ASLR entropy for the sanitizers
        run: |
          sudo sysctl vm.mmap_rnd_bits
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build libfabric and the provider under the sanitizer
        env:
          LIBFABRIC_TAG: ${{ needs.versions.outputs.libfabric_tag }}
          LIBFABRIC_COMMIT: ${{ needs.versions.outputs.libfabric_commit }}
          SAN: ${{ matrix.sanitizer }}
          CC_FOR_SAN: ${{ matrix.cc }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libibverbs-dev librdmacm-dev libnuma-dev "$CC_FOR_SAN"
          git clone --quiet --depth 1 --branch "$LIBFABRIC_TAG" https://github.com/ofiwg/libfabric.git "$RUNNER_TEMP/libfabric-src"
          test "$(git -C "$RUNNER_TEMP/libfabric-src" rev-parse HEAD)" = "$LIBFABRIC_COMMIT"
          ./scripts/build_fi_provider.sh "$RUNNER_TEMP/libfabric-src" "$RUNNER_TEMP/libfabric-$SAN" \
            --enable-efa=no --enable-tcp=yes --disable-psm3 --disable-opx --disable-usnic --disable-verbs --disable-lpp \
            CC="$CC_FOR_SAN" CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=$SAN" LDFLAGS="-fsanitize=$SAN"
      - name: Test
        env:
          SAN: ${{ matrix.sanitizer }}
          CXX_FOR_SAN: ${{ matrix.cxx }}
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/libfabric-$SAN/lib/pkgconfig" LD_LIBRARY_PATH="$RUNNER_TEMP/libfabric-$SAN/lib"
          # halt_on_error, because a report has to fail the job however the process ends. Measured on
          # this toolchain with a two-line race: leaving through `return` gives the substituted exit
          # code 66, leaving through `_Exit` gives 0 with the report only in the log. test_fi_wire and
          # rank 1 of test_fi_transfer both leave through _Exit -- deliberately, they close endpoints
          # with hostile connections open -- so without this a reported race is a green run.
          export TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1
          export ASAN_OPTIONS=halt_on_error=1:abort_on_error=1:detect_leaks=0
          cmake -S . -B "build-$SAN" -DSRDSIM_BUILD_TESTS=OFF -DSRDSIM_BUILD_FI_TEST=ON \
            -DSRDSIM_SANITIZER="$SAN" -DCMAKE_CXX_COMPILER="$CXX_FOR_SAN" -DCMAKE_CXX_FLAGS=-Werror \
            -DSRDSIM_FI_PROVIDER="$RUNNER_TEMP/libfabric-$SAN/lib/srdsim/libsrdsim-fi.so"
          cmake --build "build-$SAN" -j --target test_fi_provider test_fi_transfer test_fi_wire test_fi_multipeer test_fi_cq_threads
          ctest --test-dir "build-$SAN" -R '^fi_' --output-on-failure --timeout 900
      # The negative control for the completion-queue guard: with it off, libfabric leaves the ring unlocked for
      # the threading model the test asks for, and the test must fail with a race inside that ring. Checked the
      # way the ordering control above is -- on the reason, not just on a non-zero exit, so that a provider that
      # failed to load cannot pass as a caught race. ThreadSanitizer only: AddressSanitizer does not see this,
      # and whether the test's own counts notice depends on the race having landed wrong.
      - name: The completion-queue guard has a way to fail
        if: matrix.sanitizer == 'thread'
        env:
          SAN: ${{ matrix.sanitizer }}
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/libfabric-$SAN/lib"
          rc=0
          SRDSIM_FI_GUARD_CQ=0 TSAN_OPTIONS=halt_on_error=1 \
            ./build-$SAN/test_fi_cq_threads "$RUNNER_TEMP/libfabric-$SAN/lib/srdsim/libsrdsim-fi.so" completion \
            > unguarded.log 2>&1 || rc=$?
          test "$rc" -eq 66 || { echo "expected ThreadSanitizer's exit code 66, got $rc:"; cat unguarded.log; exit 1; }
          grep -q 'ThreadSanitizer: data race' unguarded.log \
            || { echo "it failed without reporting a race:"; cat unguarded.log; exit 1; }
          grep -Eq 'ofi_cq_(readfrom|read_entries|write_entry|write_src)' unguarded.log \
            || { echo "the race it reported is not in the completion queue:"; cat unguarded.log; exit 1; }
          echo "with the guard off, the race is reported inside the completion queue"
