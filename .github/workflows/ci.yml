name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
  plugin-abi:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        nccl: [v2.31.2-1, v2.32.3-1, v2.32.6-1]
        cuda: [cuda, nocuda]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch NCCL headers
        run: git clone --quiet --depth 1 --branch "${{ matrix.nccl }}" https://github.com/NVIDIA/nccl.git "$RUNNER_TEMP/nccl"
      - name: Type-check the plugin against the NCCL plugin ABI
        run: |
          NCCL_SRC="$RUNNER_TEMP/nccl" ./scripts/prepare_nccl_headers.sh "$RUNNER_TEMP/nccl-inc"
          DEFS=""
          if [ "${{ matrix.cuda }}" = cuda ]; then DEFS="-DSRDSIM_WITH_CUDA -DSRDSIM_WITH_GDRCOPY"; fi
          c++ -std=c++17 -O2 -fPIC -Wall -Wextra -Werror $DEFS -I "$RUNNER_TEMP/nccl-inc" -I "$RUNNER_TEMP/cuda-stub" \
            -I src -c src/nccl_rma_srdsim.cc -o "$RUNNER_TEMP/srdsim.o"
          nm "$RUNNER_TEMP/srdsim.o" | grep -q ' ncclRmaPlugin_v14$'
